<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metas Gerencia - Análisis y Compensación</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <!-- Tailwind CSS v2.2.19 -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Scripts Core -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <!-- Se fijó la versión de Recharts a la 2.1.12 para evitar el error de dependencias faltantes (ForwardRef/react-is) en compilaciones UMD recientes -->
    <script src="https://unpkg.com/recharts@2.1.12/umd/Recharts.js"></script>
    <!-- xlsx-js-style para lectura de Excel y exportación con estilos de color -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #EBF8FF;
            color: #1A365D;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 20px rgba(0, 174, 239, 0.1);
        }

        .sky-bg-primary {
            background-color: #00AEEF;
        }

        .sky-bg-primary:hover {
            background-color: #008CC1;
        }

        .sky-text {
            color: #0077A3;
        }

        .input-upper {
            text-transform: uppercase;
        }

        .text-tiny {
            font-size: 9px;
        }

        .text-header-table {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .tab-active {
            border-bottom: 3px solid #00AEEF;
            color: #00AEEF;
            font-weight: 700;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .animate-pop {
            animation: pop 0.3s ease-out;
        }

        @keyframes pop {
            from {
                transform: scale(0.98);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script>
        const e = React.createElement;
        const { useState, useEffect, useRef } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, BarChart, Bar, ReferenceLine, Cell } = window.Recharts;

        // Iconos
        const IconUpload = () => e('svg', { className: "w-3 h-3", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" }, e('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: "M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-8l-4-4m0 0L8 8m4-4v12" }));
        const IconCheck = () => e('svg', { className: "w-3 h-3 text-green-500", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" }, e('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 3, d: "M5 13l4 4L19 7" }));
        const IconTrash = () => e('svg', { className: "w-3 h-3", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" }, e('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: "M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" }));
        const IconTarget = () => e('svg', { className: "w-4 h-4 text-green-500", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" }, e('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: "M13 10V3L4 14h7v8l9-11h-7z" }));
        const IconTrendingUp = () => e('svg', { className: "w-4 h-4 text-blue-500", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" }, e('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: "M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" }));
        const IconTrophy = () => e('svg', { className: "w-4 h-4 text-purple-500", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" }, e('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: "M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" }));
        const IconAlertCircle = () => e('svg', { className: "w-4 h-4 text-red-500", fill: "none", stroke: "currentColor", viewBox: "0 0 24 24" }, e('path', { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d: "M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" }));

        const App = () => {
            const [activeTab, setActiveTab] = useState('informes');
            const [notificacion, setNotificacion] = useState(null);

            // ESTADO: Esquemas de compensación
            const [esquema, setEsquema] = useState(() => {
                const saved = localStorage.getItem('config_esquema');
                return saved ? JSON.parse(saved) : {
                    mes: '',
                    metaPCP: '38.00',
                    premioVendedor: '', premioSub: '', premioEncargado: '',
                    bateo: '', precioPromedio: '', cepipMin: '',
                    // CHECKS PARA CANDADOS: activa cada parámetro como mínimo
                    usarMetaPCP: true, usarBateo: false, usarPP: false, usarCepip: false, usarMeta3x2: false,
                    // CHECK META PCP $ (solo parámetro, sin captura de valor)
                    usarMetaPCPDollar: false,
                    // META 3X2: incremento % sobre Importe Año Ant
                    meta3x2: '',
                    diasLaborados: '', inasistencias: '',
                    // INDICADORES CORPORATIVO
                    corpPcpProyectado: '', corpBateo: '', corpPP: '', corpCepip: '',
                    bonos: []
                };
            });

            // ESTADO: Archivos cargados y data cruda
            // ESTADO INCLUYENDO 3X2 (QLIKVIEW), SUPERVISORES Y CODIGOS3X2
            const [filesStatus, setFilesStatus] = useState({
                metas: null, plantilla: null, simiescuela: null, avancePcp: null, tresPorDos: null, tresPorDosAA: null, sdr: null, sdrRazonSocial: null, cepip: null, cepipRazonSocial: null, pcpFarm: null, supervisores: null, codigos3x2: null
            });
            const [filesData, setFilesData] = useState({
                metas: null, plantilla: null, simiescuela: null, avancePcp: null, tresPorDos: null, tresPorDosAA: null, sdr: null, sdrRazonSocial: null, cepip: null, cepipRazonSocial: null, pcpFarm: null, supervisores: null, codigos3x2: null
            });
            // ESTADO: errores de carga de archivos por carpeta
            const [folderLoadErrors, setFolderLoadErrors] = useState({});
            const [folderLoadLog, setFolderLoadLog] = useState([]);

            // ESTADO: Sincronización con Google Apps Script
            const [syncStatus, setSyncStatus] = useState(null); // { loading: boolean, message: string, error: boolean }


            // ESTADO: Carga de carpeta
            const [isFolderLoading, setIsFolderLoading] = useState(false);
            const [folderLoadingMsg, setFolderLoadingMsg] = useState('');

            // ESTADO: Productos 3x2 y Modal
            const [productos3x2, setProductos3x2] = useState([]);
            const [productos3x2Seleccionados, setProductos3x2Seleccionados] = useState(new Set());
            const [showModal3x2, setShowModal3x2] = useState(false);
            const [filtroModal3x2, setFiltroModal3x2] = useState('');

            // ESTADO: Resultados del Análisis y Filtros
            const [analisisResultado, setAnalisisResultado] = useState(null);
            const [analisisResultadoSupervisores, setAnalisisResultadoSupervisores] = useState(null);
            const [indicadorGerenciaData, setIndicadorGerenciaData] = useState(null);
            const [filtroFarmacia, setFiltroFarmacia] = useState('');

            // ESTADO: CLIENTE CONEXION
            const [isConnecting, setIsConnecting] = useState(false);
            const [connectionError, setConnectionError] = useState(null);
            const [lastSyncTime, setLastSyncTime] = useState(null);

            // FUNCIÓN PARA OBTENER DATOS (CLIENTE)
            const fetchDatosCliente = async () => {
                setIsConnecting(true);
                setConnectionError(null);

                const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyYldLxhFWGjjFQB5_PACWFesrgEIhPDlVPnJxlu14STNeyBi_4lTr5QJlVlxhFrFmD/exec";
                const SECRET_TOKEN = "T0k3nS3gur0_Metas2026";

                try {
                    const res = await fetch(`${WEB_APP_URL}?token=${SECRET_TOKEN}`);
                    const data = await res.json();

                    if (data.status === 'error' || data.status === 'empty') {
                        throw new Error(data.message || "No hay datos sincronizados");
                    }

                    // data contains the payload directly because we return ContentService.createTextOutput(payload)
                    if (data.esquema) setEsquema(data.esquema);
                    if (data.indicadorGerenciaData) setIndicadorGerenciaData(data.indicadorGerenciaData);
                    if (data.analisisResultado) setAnalisisResultado(data.analisisResultado);
                    if (data.analisisResultadoSupervisores) setAnalisisResultadoSupervisores(data.analisisResultadoSupervisores);

                    setNotificacion("Datos sincronizados correctamente");
                    // TIMESTAMP ÚLTIMA SINCRONIZACIÓN
                    setLastSyncTime(data.syncTimestamp || new Date().toLocaleString('es-MX', { dateStyle: 'short', timeStyle: 'short' }));
                    setTimeout(() => setNotificacion(null), 3000);
                } catch (err) {
                    setConnectionError(err.message);
                } finally {
                    setIsConnecting(false);
                }
            };

            // EJECUTAR FETCH AL INICIAR EL CLIENTE
            React.useEffect(() => {
                fetchDatosCliente();
            }, []);
            const [filtroEmpleado, setFiltroEmpleado] = useState('');
            const [filtroSupervisor, setFiltroSupervisor] = useState('');
            const [expandedFarmacias, setExpandedFarmacias] = useState({});

            // ESTADOS: Ordenamiento y Filtros por Encabezados de Columna
            const [sortConfig, setSortConfig] = useState({ key: null, direction: 'asc' });
            const [columnFilters, setColumnFilters] = useState({});
            const [activeFilterDropdown, setActiveFilterDropdown] = useState(null);
            const [searchFilterText, setSearchFilterText] = useState('');
            // ESTADO PANEL DETALLE FARMACIAS (Informes)
            const [panelDetalle, setPanelDetalle] = useState(null);
            // ESTADO SELECCIÓN RUBRO GRÁFICA SUPERVISOR
            const [rubroSupervisorSeleccionado, setRubroSupervisorSeleccionado] = useState('PCP');
            const [supervisorGraficaSeleccionado, setSupervisorGraficaSeleccionado] = useState('TODOS');

            // Lógica: Guardar Esquema
            const handleSaveEsquema = () => {
                localStorage.setItem('config_esquema', JSON.stringify(esquema));
                setNotificacion('Esquema guardado correctamente');
                setTimeout(() => setNotificacion(null), 3000);
            };

            // Lógica: Carga de Archivos
            const handleFileUpload = (ev, type) => {
                const file = ev.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = evt.target.result;
                        const workbook = XLSX.read(data, { type: 'binary', raw: false });
                        let targetSheet = workbook.SheetNames[0];

                        // Si es Metas, buscar hoja con Id_similar / id_franquicia o Hoja2
                        if (type === 'metas') {
                            const metasSheetName = workbook.SheetNames.find(s => s === 'Hoja2') ||
                                workbook.SheetNames.find(s => {
                                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[s], { header: 1, defval: '' });
                                    return rows.some(r => r.some(c => String(c).toLowerCase().includes('similar') || String(c).toLowerCase().includes('id_franquicia')));
                                }) || workbook.SheetNames[0];
                            const mRows = XLSX.utils.sheet_to_json(workbook.Sheets[metasSheetName], { header: 1, defval: '' });
                            let headerIdx = mRows.findIndex(r => r.some(c => String(c).toLowerCase().includes('id_franquicia') || String(c).toLowerCase().includes('similar') || String(c).toLowerCase().includes('farmacia')));
                            let metasJson = [];
                            if (headerIdx !== -1) {
                                const headers = mRows[headerIdx];
                                metasJson = mRows.slice(headerIdx + 1).map(r => {
                                    const obj = {};
                                    headers.forEach((h, idx) => {
                                        if (h) obj[String(h).trim()] = r[idx];
                                    });
                                    return obj;
                                }).filter(r => (r['id_franquicia'] || r['Id_similar'] || r['Id'] || r['Farmacia']) !== undefined);
                            } else {
                                metasJson = XLSX.utils.sheet_to_json(workbook.Sheets[metasSheetName], { defval: '' });
                            }

                            // EXTRAER HOJA SUPERVISORES SI EXISTE
                            let supervisoresJson = [];
                            if (workbook.SheetNames.includes('SUPERVISORES')) {
                                supervisoresJson = XLSX.utils.sheet_to_json(workbook.Sheets['SUPERVISORES'], { defval: '' });
                            }

                            setFilesStatus(prev => ({ ...prev, metas: { name: file.name, count: metasJson.length }, supervisores: supervisoresJson.length > 0 ? { name: 'SUPERVISORES', count: supervisoresJson.length } : null }));
                            setFilesData(prev => ({ ...prev, metas: metasJson, supervisores: supervisoresJson }));
                            setNotificacion(`Archivo Metas cargado (${metasJson.length} metas, ${supervisoresJson.length} supervisores)`);
                            setTimeout(() => setNotificacion(null), 3000);
                            return;
                        }

                        // Si es plantilla, buscar hoja 'Empleados'
                        if (type === 'plantilla' && workbook.SheetNames.includes('Empleados')) {
                            targetSheet = 'Empleados';
                        }

                        // Si es SDR, buscar hoja de BATEO POR UNIDAD y % BATEO RAZÓN SOCIAL
                        if (type === 'sdr') {
                            // Extraer Bateo por Unidad
                            const sdrSheetName = workbook.SheetNames.find(s => s.toUpperCase().includes('BATEO') && s.toUpperCase().includes('UNIDAD')) || workbook.SheetNames[0];
                            const sdrSheetObj = workbook.Sheets[sdrSheetName];
                            const sdrRows = XLSX.utils.sheet_to_json(sdrSheetObj, { header: 1, defval: '' });
                            let headerIdx = sdrRows.findIndex(r => r.some(c => String(c).toUpperCase().includes('CVE UNIDAD')));
                            let sdrJson = [];
                            if (headerIdx !== -1) {
                                const headers = sdrRows[headerIdx];
                                sdrJson = sdrRows.slice(headerIdx + 1).map(r => {
                                    const obj = {};
                                    headers.forEach((h, idx) => {
                                        if (h) obj[String(h).trim()] = r[idx];
                                    });
                                    return obj;
                                }).filter(r => r['CVE UNIDAD'] !== undefined && String(r['CVE UNIDAD']).trim() !== '');
                            } else {
                                sdrJson = XLSX.utils.sheet_to_json(sdrSheetObj, { defval: '' });
                            }

                            // Extraer hoja "% BATEO RAZÓN SOCIAL" (sin UNIDAD) - [B]=RazonSocial [C]=PRECIO PROMEDIO GRAL. [D]=% BATEO GRAL.
                            const rsSheetName = workbook.SheetNames.find(s => {
                                const su = s.toUpperCase().replace('RAZ\u00d3N', 'RAZON');
                                return (su.includes('BATEO') && su.includes('RAZON') && !su.includes('UNIDAD'));
                            });
                            let sdrRsJson = [];
                            if (rsSheetName) {
                                const rsSheetObj = workbook.Sheets[rsSheetName];
                                // Fila 7 (idx 6) es el encabezado según Estructura_archivo.md
                                const rsRows = XLSX.utils.sheet_to_json(rsSheetObj, { header: 1, defval: '' });
                                // Buscar fila de encabezado por contenido en col B (idx 1)
                                let rsHeaderIdx = rsRows.findIndex(r => String(r[1] || '').toUpperCase().includes('RAZON'));
                                if (rsHeaderIdx === -1) rsHeaderIdx = 6; // fallback fila 7
                                sdrRsJson = rsRows.slice(rsHeaderIdx + 1)
                                    .map(r => ({ razonSocial: r[1], pp: r[2], bateo: r[3] }))
                                    .filter(r => String(r.razonSocial || '').trim() !== '');
                            }

                            setFilesStatus(prev => ({ ...prev, sdr: { name: file.name, count: sdrJson.length }, sdrRazonSocial: { name: file.name, count: sdrRsJson.length } }));
                            setFilesData(prev => ({ ...prev, sdr: sdrJson, sdrRazonSocial: sdrRsJson }));
                            setNotificacion(`Archivo SDR cargado (${sdrJson.length} registros unidad, ${sdrRsJson.length} registros razón social)`);
                            setTimeout(() => setNotificacion(null), 3000);
                            return;
                        }

                        // Si es CEPIP, buscar hoja 'Farm-R.Social'
                        if (type === 'cepip') {
                            const cepipSheetName = workbook.SheetNames.find(s => s.toUpperCase().includes('FARM')) || workbook.SheetNames[0];
                            const cepipSheetObj = workbook.Sheets[cepipSheetName];
                            const cepipRows = XLSX.utils.sheet_to_json(cepipSheetObj, { header: 1, defval: '' });
                            let headerIdx = cepipRows.findIndex(r => r.some(c => String(c).toUpperCase().includes('CVEUNIDAD') || String(c).toUpperCase().includes('CVE UNIDAD')));
                            let cepipJson = [];
                            if (headerIdx !== -1) {
                                const headers = cepipRows[headerIdx];
                                cepipJson = cepipRows.slice(headerIdx + 1).map(r => {
                                    const obj = {};
                                    headers.forEach((h, idx) => {
                                        if (h) obj[String(h).trim()] = r[idx];
                                    });
                                    return obj;
                                }).filter(r => (r['CveUnidad'] || r['CVE UNIDAD'] || r['CVEUNIDAD']) !== undefined);
                            } else {
                                cepipJson = XLSX.utils.sheet_to_json(cepipSheetObj, { defval: '' });
                            }

                            // Extraer hoja "Razon Social" - [B]=RazonSocial [C]=ALCANCE ACUM
                            const rsSheetName = workbook.SheetNames.find(s => {
                                const su = s.toUpperCase().replace('RAZ\u00d3N', 'RAZON').trim();
                                return su === 'RAZON SOCIAL';
                            });
                            let cepipRsJson = [];
                            if (rsSheetName) {
                                const rsSheetObj = workbook.Sheets[rsSheetName];
                                const rsRows = XLSX.utils.sheet_to_json(rsSheetObj, { header: 1, defval: '' });
                                // ESCANEAR TODAS LAS FILAS: col[B]=idx1, col[C]=idx2
                                rsRows.forEach(r => {
                                    if (String(r[1] || '').trim() !== '') {
                                        cepipRsJson.push({ razonSocial: r[1], alcanceAcum: r[2] });
                                    }
                                });
                            }

                            setFilesStatus(prev => ({ ...prev, cepip: { name: file.name, count: cepipJson.length }, cepipRazonSocial: { name: file.name, count: cepipRsJson.length } }));
                            setFilesData(prev => ({ ...prev, cepip: cepipJson, cepipRazonSocial: cepipRsJson }));
                            setNotificacion(`Archivo CEPIP cargado (${cepipJson.length} registros unidad, ${cepipRsJson.length} registros razón social)`);
                            setTimeout(() => setNotificacion(null), 3000);
                            return;
                        }

                        // CARGA CSV PCP FARM: columna [C] = Importe Acum. PcP por farmacia
                        if (type === 'pcpFarm') {
                            const pcpFarmSheet = workbook.Sheets[targetSheet];
                            const rawJson = XLSX.utils.sheet_to_json(pcpFarmSheet, { defval: '' });
                            const g2Cell = pcpFarmSheet['G2'];
                            const pcpFarmG2 = g2Cell ? g2Cell.v : 0;
                            setFilesStatus(prev => ({ ...prev, pcpFarm: { name: file.name, count: rawJson.length } }));
                            setFilesData(prev => ({ ...prev, pcpFarm: rawJson, pcpFarmG2 }));
                            setNotificacion(`Archivo PCP FARM cargado (${rawJson.length} registros)`);
                            setTimeout(() => setNotificacion(null), 3000);
                            return;
                        }

                        // CARGA Y PROCESAMIENTO MODULO 3X2 (QLIKVIEW)
                        if (type === 'tresPorDos') {
                            const tresPorDosSheet = workbook.Sheets[targetSheet];
                            const rawJson = XLSX.utils.sheet_to_json(tresPorDosSheet, { defval: '' });
                            // Filtrar filas vacias o de encabezado y extraer productos unicos
                            const prodsSet = new Set();
                            const cleanedRows = [];
                            rawJson.forEach(row => {
                                const prod = String(row['ProductoFin'] || row['PRODUCTOFIN'] || row['Producto'] || row['PRODUCTO'] || '').trim();
                                const farm = String(row['Farmacia'] || row['FARMACIA'] || '').trim();
                                if (prod) prodsSet.add(prod);
                                if (farm || prod) cleanedRows.push(row);
                            });
                            const prodsArray = Array.from(prodsSet).sort();
                            setProductos3x2(prodsArray);
                            // INICIALIZACION DE TABLA VACIA PARA SELECCION MANUAL
                            setProductos3x2Seleccionados(new Set());
                            setFiltroModal3x2('');
                            setFilesStatus(prev => ({ ...prev, tresPorDos: { name: file.name, count: cleanedRows.length } }));
                            setFilesData(prev => ({ ...prev, tresPorDos: cleanedRows }));
                            setShowModal3x2(true);
                            setNotificacion(`Archivo 3x2 cargado (${cleanedRows.length} registros, ${prodsArray.length} productos)`);
                            setTimeout(() => setNotificacion(null), 3500);
                            return;
                        }

                        // CARGA Y PROCESAMIENTO MODULO 3X2 AA (QLIKVIEW)
                        if (type === 'tresPorDosAA') {
                            const tresPorDosAASheet = workbook.Sheets[targetSheet];
                            const rawJson = XLSX.utils.sheet_to_json(tresPorDosAASheet, { defval: '' });
                            const cleanedRows = [];
                            rawJson.forEach(row => {
                                const prod = String(row['ProductoFin'] || row['PRODUCTOFIN'] || row['Producto'] || row['PRODUCTO'] || '').trim();
                                const farm = String(row['Farmacia'] || row['FARMACIA'] || '').trim();
                                if (farm || prod) cleanedRows.push(row);
                            });
                            setFilesStatus(prev => ({ ...prev, tresPorDosAA: { name: file.name, count: cleanedRows.length } }));
                            setFilesData(prev => ({ ...prev, tresPorDosAA: cleanedRows }));
                            setNotificacion(`Archivo 3x2 AA cargado (${cleanedRows.length} registros)`);
                            setTimeout(() => setNotificacion(null), 3500);
                            return;
                        }

                        const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[targetSheet], { defval: '' });

                        setFilesStatus(prev => ({ ...prev, [type]: { name: file.name, count: jsonData.length } }));
                        setFilesData(prev => ({ ...prev, [type]: jsonData }));
                        setNotificacion(`Archivo ${file.name} cargado (${jsonData.length} registros)`);
                        setTimeout(() => setNotificacion(null), 3000);
                    } catch (err) {
                        alert("Error al procesar el archivo: " + err.message);
                    }
                };
                reader.readAsBinaryString(file);
            };

            // Helper de normalización y parsing de números/porcentajes
            const parseNum = (val) => {
                if (typeof val === 'number') return val;
                if (!val) return 0;
                const clean = String(val).replace(/[^0-9.-]+/g, "");
                const num = parseFloat(clean);
                return isNaN(num) ? 0 : num;
            };

            const parsePercent = (val) => {
                if (typeof val === 'number') return val <= 1 && val > 0 ? val * 100 : val;
                if (!val) return 0;
                const clean = String(val).replace('%', '').trim();
                const num = parseFloat(clean);
                if (isNaN(num)) return 0;
                return num <= 1 && num > 0 ? num * 100 : num;
            };

            const normalizeEmployeeCode = (val) => {
                if (val === null || val === undefined) return '';
                const str = String(val).trim();
                if (!str) return '';
                const num = parseInt(str, 10);
                return isNaN(num) ? str.replace(/^0+/, '') : String(num);
            };

            const normalizeKey = (val) => {
                if (val === null || val === undefined) return '';
                const str = String(val).trim().toUpperCase();
                if (!str) return '';
                const num = parseInt(str, 10);
                return isNaN(num) ? str : String(num);
            };

            // LÓGICA CENTRAL: _runAnalysis acepta datos inyectados o filesData
            const _runAnalysis = (fd) => {
                if (!fd.avancePcp || fd.avancePcp.length === 0) {
                    alert("Por favor carga el archivo 'Avance Gral PCP' para realizar el análisis.");
                    return;
                }
                if (!fd.plantilla || fd.plantilla.length === 0) {
                    alert("Por favor carga el archivo 'Plantilla' para cruzar la información de empleados.");
                    return;
                }

                // 1. OBTENER NOMBRE DEL MES DEL CALENDARIO
                const mesesNombres = ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
                let mesNombreSeleccionado = '';
                if (esquema.mes) {
                    const mesIndex = parseInt(esquema.mes.split('-')[1], 10) - 1;
                    if (mesIndex >= 0 && mesIndex < 12) {
                        mesNombreSeleccionado = mesesNombres[mesIndex];
                    }
                }

                // 2. MAPEO DE PLANTILLA (CÓDIGO NUMÉRICO -> DATOS EMPLEADO)
                const plantillaMap = new Map();
                fd.plantilla.forEach(emp => {
                    const cod = normalizeEmployeeCode(emp['Código'] || emp['Codigo'] || emp['CODIGO'] || emp['CÓDIGO'] || '');
                    if (cod) {
                        plantillaMap.set(cod, {
                            apellidoPaterno: emp['Apellido paterno'] || emp['Apellido Paterno'] || '',
                            apellidoMaterno: emp['Apellido materno'] || emp['Apellido Materno'] || '',
                            nombre: emp['Nombre'] || emp['NOMBRE'] || '',
                            puesto: emp['Puesto'] || emp['PUESTO'] || ''
                        });
                    }
                });

                // 3. MAPEO DE METAS (id_franquicia / Farmacia -> Id_similar Y VALOR META DEL MES)
                const metasMap = new Map();
                const metasImporteMap = new Map();
                if (fd.metas && Array.isArray(fd.metas)) {
                    fd.metas.forEach(row => {
                        const idFranq = normalizeKey(row['id_franquicia'] || row['Id_franquicia'] || row['ID_FRANQUICIA'] || row['Id'] || row['ID'] || '');
                        const idSim = normalizeKey(row['Id_similar'] || row['Id_Similar'] || row['ID_SIMILAR'] || row['Id'] || '');
                        const farmName = String(row['Farmacia'] || row['FARMACIA'] || '').trim().toUpperCase();

                        if (idFranq && idSim) metasMap.set(idFranq, idSim);
                        if (farmName && idSim) metasMap.set(farmName, idSim);
                        if (idSim) metasMap.set(idSim, idSim);

                        // Buscar el valor de la meta según el mes seleccionado
                        let valMetaMes = 0;
                        if (mesNombreSeleccionado) {
                            const metaColKey = Object.keys(row).find(k => k.trim().toUpperCase() === mesNombreSeleccionado);
                            if (metaColKey) {
                                valMetaMes = parseNum(row[metaColKey]);
                            }
                        }

                        if (valMetaMes > 0) {
                            if (idFranq) metasImporteMap.set(idFranq, valMetaMes);
                            if (farmName) metasImporteMap.set(farmName, valMetaMes);
                            if (idSim) metasImporteMap.set(idSim, valMetaMes);
                        }
                    });
                }

                // 3b. MAPEO PCP FARM: farmacia -> Importe Acum. PcP (columna [C]) y % Imp. PcP (columna [D])
                const pcpFarmMap = new Map();
                let sumProyPcpGerencia = 0;

                // INDICADOR GERENCIA: buscar fila de totales para PCP%, sumar acumulados
                let gerenciaPcpPct = 0;
                if (fd.pcpFarmG2 !== undefined) {
                    const pctStr = String(fd.pcpFarmG2).replace('%', '').replace(',', '.').trim();
                    const pctNum = parseFloat(pctStr) || 0;
                    gerenciaPcpPct = pctNum > 0 && pctNum <= 1 ? pctNum * 100 : pctNum;
                }
                
                let gerenciaPcpAcum = 0;
                let sumPctPcpGerencia = 0;
                let countPcpGerencia = 0;

                if (fd.pcpFarm && Array.isArray(fd.pcpFarm)) {
                    fd.pcpFarm.forEach((row) => {
                        const farm = String(row['Farmacia'] || row['FARMACIA'] || '').trim();
                        const farmUpper = farm.toUpperCase();
                        const impAcum = parseNum(row['Importe Acum. PcP'] || row['Importe Acum. Pcp'] || row['IMPORTE ACUM. PCP'] || 0);
                        const impProy = parseNum(row['Importe Proy. PcP'] || row['Importe Proy. Pcp'] || row['IMPORTE PROY. PCP'] || 0);
                        
                        // PCP%: buscar dinámicamente la columna para evitar errores de espacios/corchetes
                        const pcpKey = Object.keys(row).find(k => k.toUpperCase().includes('%') && k.toUpperCase().includes('IMP') && k.toUpperCase().includes('PCP')) || '% Imp. PcP';
                        const rawPctPcp = row[pcpKey] || 0;
                        const pctStr = String(rawPctPcp).replace('%', '').replace(',', '.').trim();
                        const pctNum = parseFloat(pctStr) || 0;
                        // Si viene como decimal puro (< 1), convertir a porcentaje
                        const pctPcpNorm = pctNum > 0 && pctNum <= 1 ? pctNum * 100 : pctNum;

                        const isTotalRow = farm === '' || farmUpper === 'TOTAL' || farmUpper === 'GERENCIA' || farmUpper.includes('TOTALES');

                        if (!isTotalRow) {
                            pcpFarmMap.set(farm, { impAcum, pctPcp: pctPcpNorm });
                            sumProyPcpGerencia += impProy;
                            gerenciaPcpAcum += impAcum; // SUMAMOS LOS ACUMULADOS
                            sumPctPcpGerencia += pctPcpNorm;
                            countPcpGerencia++;
                        }
                    });
                }
                
                // Fallback: si no se encontró la celda G2 en el Excel, promediamos para no mostrar 0.00%
                if (gerenciaPcpPct === 0 && countPcpGerencia > 0) {
                    gerenciaPcpPct = sumPctPcpGerencia / countPcpGerencia;
                }

                // MAPEO SUPERVISORES Y CORTO
                const supervisoresMap = new Map();
                const cortoMap = new Map();
                if (fd.supervisores && Array.isArray(fd.supervisores)) {
                    fd.supervisores.forEach(row => {
                        const idFranq = normalizeKey(row['id_franquicia'] || row['Id_franquicia'] || row['ID_FRANQUICIA'] || '');
                        const idSim = normalizeKey(row['Id_similar'] || row['Id_Similar'] || row['ID_SIMILAR'] || '');
                        const sup = String(row['SUPERVISOR'] || row['Supervisor'] || '').trim().toUpperCase();
                        const corto = String(row['CORTO'] || row['Corto'] || row['corto'] || '').trim().toUpperCase();
                        if (idFranq && sup) supervisoresMap.set(idFranq, sup);
                        if (idSim && sup) supervisoresMap.set(idSim, sup);
                        if (idFranq && corto) cortoMap.set(idFranq, corto);
                        if (idSim && corto) cortoMap.set(idSim, corto);
                    });
                }

                // MAPEO ORIGINAL ID FRANQUICIA (para exportar a Excel)
                const originalIdFranquiciaMap = new Map();
                if (fd.metas && Array.isArray(fd.metas)) {
                    fd.metas.forEach(row => {
                        const idFranqRaw = row['id_franquicia'] || row['Id_franquicia'] || row['ID_FRANQUICIA'] || row['Id'] || row['ID'] || '';
                        const idSim = normalizeKey(row['Id_similar'] || row['Id_Similar'] || row['ID_SIMILAR'] || row['Id'] || '');
                        if (idSim && idFranqRaw) originalIdFranquiciaMap.set(idSim, String(idFranqRaw).trim());
                    });
                }
                if (fd.supervisores && Array.isArray(fd.supervisores)) {
                    fd.supervisores.forEach(row => {
                        const idFranqRaw = row['id_franquicia'] || row['Id_franquicia'] || row['ID_FRANQUICIA'] || '';
                        const idSim = normalizeKey(row['Id_similar'] || row['Id_Similar'] || row['ID_SIMILAR'] || '');
                        if (idSim && idFranqRaw) originalIdFranquiciaMap.set(idSim, String(idFranqRaw).trim());
                    });
                }

                // 4. MAPEO DE SDR (CVE UNIDAD -> PRECIO PROMEDIO Y % BATEO)
                const sdrMap = new Map();
                let gerenciaPP = 0;
                let gerenciaBateo = 0;
                if (fd.sdr && Array.isArray(fd.sdr)) {
                    fd.sdr.forEach(row => {
                        const rawCve = row['CVE UNIDAD'] || row['CveUnidad'] || row['CVE_UNIDAD'] || row['Cve Unidad'] || '';
                        const cveKey = normalizeKey(rawCve);

                        const pp = parseNum(row['PRECIO PROMEDIO'] || row['Precio Promedio'] || row['PRECIO PROMEDIO GRAL.'] || 0);
                        const bat = parsePercent(row['% BATEO'] || row['%Bateo'] || row['% Bateo'] || row['% BATEO GRAL.'] || 0);

                        if (cveKey) {
                            sdrMap.set(cveKey, { pp, bat });
                        }
                    });
                }

                if (fd.sdrRazonSocial && Array.isArray(fd.sdrRazonSocial)) {
                    fd.sdrRazonSocial.forEach(row => {
                        // col[B]=razonSocial, col[C]=PP, col[D]=Bateo - GENERICOS DEL TROPICO
                        const razonSocial = String(row.razonSocial || '').trim().toUpperCase().replace(/\s+/g, ' ');
                        if (razonSocial === "GENERICOS DEL TROPICO, S.A DE C.V.") {
                            // SIN CONVERSIÓN: valor crudo; si decimal (<1) multiplicar x100
                            const rawPP = row.pp;
                            const rawBateo = row.bateo;
                            const ppNum = rawPP !== undefined && rawPP !== '' ? parseFloat(String(rawPP).replace('%', '').replace(',', '.').trim()) || 0 : 0;
                            const batNum = rawBateo !== undefined && rawBateo !== '' ? parseFloat(String(rawBateo).replace('%', '').replace(',', '.').trim()) || 0 : 0;
                            gerenciaPP = ppNum; // PP viene como valor directo (ej: 72.10)
                            gerenciaBateo = batNum > 0 && batNum <= 1 ? batNum * 100 : batNum; // Bateo viene como decimal 0.19148
                        }
                    });
                }

                // 5. MAPEO DE CEPIP (CVE UNIDAD -> ALCANCE ACUM %)
                const cepipMap = new Map();
                let gerenciaCepip = 0;
                if (fd.cepip && Array.isArray(fd.cepip)) {
                    fd.cepip.forEach(row => {
                        const rawCve = row['CveUnidad'] || row['CVE UNIDAD'] || row['Cve Unidad'] || row['Id_similar'] || '';
                        const cveKey = normalizeKey(rawCve);
                        const rawAlcance = row['ALCANCE ACUM'] || row['Alcance Acum'] || row['ALCANCE_ACUM'] || 0;
                        const rawNum = parseFloat(String(rawAlcance).replace('%', '').trim()) || 0;
                        // CEPIP: multiplicar x100 para visualizar como porcentaje
                        const alcanceAcum = rawNum * 100;

                        if (cveKey) {
                            cepipMap.set(cveKey, alcanceAcum);
                        }
                    });
                }

                if (fd.cepipRazonSocial && Array.isArray(fd.cepipRazonSocial)) {
                    fd.cepipRazonSocial.forEach(row => {
                        // col[B]=razonSocial, col[C]=ALCANCE ACUM - GENERICOS DEL TROPICO
                        const razonSocial = String(row.razonSocial || '').trim().toUpperCase().replace(/\s+/g, ' ');
                        if (razonSocial === "GENERICOS DEL TROPICO, S.A DE C.V.") {
                            // SIN CONVERSIÓN: si decimal (<1) multiplicar x100 (ej: 0.812283 -> 81.23)
                            const rawCepip = row.alcanceAcum;
                            const cepipNum = rawCepip !== undefined && rawCepip !== '' ? parseFloat(String(rawCepip).replace('%', '').replace(',', '.').trim()) || 0 : 0;
                            gerenciaCepip = cepipNum;
                        }
                    });
                }

                // SUPERVISORES
                const supervisorMap = new Map();
                if (fd.supervisores && fd.supervisores.length > 0) {
                    fd.supervisores.forEach(row => {
                        const rawCve = row['Id_similar'] || row['id_franquicia'] || row['FARMACIA'] || '';
                        const sup = String(row['SUPERVISOR'] || '').trim();
                        const cveKey = normalizeKey(rawCve);
                        if (cveKey && sup) supervisorMap.set(cveKey, sup);
                    });
                }

                // 6. AGRUPACIÓN Y CRUCE DE DATOS POR FARMACIA Y EMPLEADO
                const farmaciasMap = new Map();
                const minDiasElegibilidad = parseInt(esquema.diasLaborados, 10) || 0;
                // CANDADOS: solo aplica el parámetro si el check está activo
                const metaPcpBase = (esquema.usarMetaPCP !== false) ? parsePercent(esquema.metaPCP || 0) : 0;
                const metaBateo = esquema.usarBateo ? parsePercent(esquema.bateo || 0) : 0;
                const metaPP = esquema.usarPP ? parseNum(esquema.precioPromedio || 0) : 0;
                const metaCepip = esquema.usarCepip ? parsePercent(esquema.cepipMin || 0) : 0;
                const bonosConfig = esquema.bonos || [];
                // META 3X2: aplicar si hay porcentaje
                const meta3x2Pct = parseFloat(esquema.meta3x2 || 0) || 0;

                // EXTRAER CÓDIGOS 3X2 VÁLIDOS SI SE CARGÓ EL ARCHIVO
                const codigos3x2Set = new Set();
                if (fd.codigos3x2 && Array.isArray(fd.codigos3x2)) {
                    fd.codigos3x2.forEach(row => {
                        const c = String(row['CODIGO'] || row['Codigo'] || row['codigo'] || '').trim();
                        if (c) codigos3x2Set.add(c);
                    });
                }

                // CONSTRUIR MAPA 3X2: farmacia -> { importeAcum, importeAntAño } filtrando solo productos seleccionados
                const tresPorDosMap = new Map();
                if (fd.tresPorDos && fd.tresPorDos.length > 0) {
                    fd.tresPorDos.forEach(row => {
                        const prod = String(row['ProductoFin'] || row['PRODUCTOFIN'] || '').trim();
                        // Filtrar por el archivo CODIGOS 3X2 si está cargado
                        if (codigos3x2Set.size > 0) {
                            const codProdMatch = prod.match(/^(\d+)/);
                            const codProd = codProdMatch ? codProdMatch[1] : null;
                            if (!codProd || !codigos3x2Set.has(codProd)) return;
                        }
                        const farm = String(row['Farmacia'] || row['FARMACIA'] || '').trim();
                        if (!farm) return;
                        const impAcum3 = parseNum(row['Importe Acumulado'] || row['IMPORTE ACUMULADO'] || 0);
                        const impAnt3 = parseNum(row['Importe Año Ant'] || row['IMPORTE AÑO ANT'] || row['Importe Año Anterior'] || 0);
                        if (!tresPorDosMap.has(farm)) tresPorDosMap.set(farm, { acum: 0, ant: 0 });
                        const cur = tresPorDosMap.get(farm);
                        cur.acum += impAcum3;
                        cur.ant += impAnt3;
                    });
                }

                // CONSTRUIR MAPA 3X2 AA: farmacia -> { importeAcum } filtrando solo productos seleccionados
                const tresPorDosAAMap = new Map();
                if (fd.tresPorDosAA && fd.tresPorDosAA.length > 0) {
                    fd.tresPorDosAA.forEach(row => {
                        const prod = String(row['ProductoFin'] || row['PRODUCTOFIN'] || '').trim();
                        // Filtrar por el archivo CODIGOS 3X2 si está cargado
                        if (codigos3x2Set.size > 0) {
                            const codProdMatch = prod.match(/^(\d+)/);
                            const codProd = codProdMatch ? codProdMatch[1] : null;
                            if (!codProd || !codigos3x2Set.has(codProd)) return;
                        }
                        const farm = String(row['Farmacia'] || row['FARMACIA'] || '').trim();
                        if (!farm) return;
                        const impAcum3 = parseNum(row['Importe Acumulado'] || row['IMPORTE ACUMULADO'] || 0);
                        if (!tresPorDosAAMap.has(farm)) tresPorDosAAMap.set(farm, { acum: 0 });
                        const cur = tresPorDosAAMap.get(farm);
                        cur.acum += impAcum3;
                    });
                }

                fd.avancePcp.forEach(row => {
                    const farmacia = String(row['Farmacia'] || row['FARMACIA'] || 'SIN FARMACIA').trim();
                    const rawCod = row['# Empleado'] || row['#Empleado'] || row['Empleado'] || row['Código'] || row['Codigo'] || '';
                    const codEmpleado = normalizeEmployeeCode(rawCod);
                    const diaVal = row['Dia'] || row['DIA'] || row['Día'] || '';
                    const impAcum = parseNum(row['Importe Acum. PcP'] || row['Importe Acum. Pcp'] || row['Importe Acumulado'] || 0);
                    const pctImp = parsePercent(row['% Imp. PcP'] || row['%Imp. PcP'] || row['% Imp PcP'] || 0);

                    if (!farmaciasMap.has(farmacia)) {
                        farmaciasMap.set(farmacia, new Map());
                    }
                    const empMap = farmaciasMap.get(farmacia);

                    if (!empMap.has(codEmpleado)) {
                        const infoPlantilla = plantillaMap.get(codEmpleado) || {
                            apellidoPaterno: '', apellidoMaterno: '', nombre: 'No registrado', puesto: 'SIN PUESTO'
                        };

                        empMap.set(codEmpleado, {
                            farmacia,
                            codigo: codEmpleado,
                            apellidoPaterno: infoPlantilla.apellidoPaterno,
                            apellidoMaterno: infoPlantilla.apellidoMaterno,
                            nombre: infoPlantilla.nombre,
                            nombreCompleto: `${infoPlantilla.apellidoPaterno} ${infoPlantilla.apellidoMaterno} ${infoPlantilla.nombre}`.trim(),
                            puesto: infoPlantilla.puesto,
                            diasCount: diaVal ? 1 : 0,
                            sumImporteAcum: impAcum,
                            sumPctImp: pctImp,
                            totalRecords: 1
                        });
                    } else {
                        const cur = empMap.get(codEmpleado);
                        if (diaVal) cur.diasCount += 1;
                        cur.sumImporteAcum += impAcum;
                        cur.sumPctImp += pctImp;
                        cur.totalRecords += 1;
                    }
                });

                // 7. CÁLCULO DE CUMPLIMIENTO, CANDADOS (C1, C2, C3), BONOS Y PREMIOS
                const resultadoFarmacias = [];

                farmaciasMap.forEach((empleadosMap, farmaciaNombre) => {
                    const farmaciaClean = farmaciaNombre.trim();
                    const parts = farmaciaClean.split('-');
                    const codePart = normalizeKey(parts[0]);
                    const namePart = (parts.length > 1 ? parts.slice(1).join('-') : farmaciaClean).trim().toUpperCase();

                    const idSimilar = metasMap.get(codePart) || metasMap.get(namePart) || codePart || normalizeKey(farmaciaClean);
                    const originalIdFranquicia = originalIdFranquiciaMap.get(idSimilar) || originalIdFranquiciaMap.get(codePart) || codePart;
                    const supervisorName = supervisorMap.get(idSimilar) || supervisorMap.get(codePart) || supervisorMap.get(normalizeKey(farmaciaClean)) || 'SIN SUPERVISOR';
                    const supervisor = supervisoresMap.get(idSimilar) || supervisoresMap.get(codePart) || 'SIN SUPERVISOR';
                    const cortoName = cortoMap.get(idSimilar) || cortoMap.get(codePart) || namePart || farmaciaClean;

                    const sdrInfo = sdrMap.get(idSimilar) || { pp: 0, bat: 0 };
                    const farmaciaCepip = cepipMap.has(idSimilar) ? cepipMap.get(idSimilar) : 0;

                    // OBTENER META DE IMPORTE PCP PARA ESTA FARMACIA SEGÚN EL MES
                    const metaImportePcp = metasImporteMap.get(codePart) || metasImporteMap.get(namePart) || metasImporteMap.get(idSimilar) || metasImporteMap.get(normalizeKey(farmaciaClean)) || 0;

                    // 1. PROMEDIO % IMP. PCP DE LA FARMACIA
                    // Si hay PCP FARM cargado, usar Importe Acum. PcP de ese archivo para calcular % farmacia
                    let sumImporteAcumFarmacia = 0;
                    let sumPct = 0;
                    empleadosMap.forEach(emp => {
                        const pctEmp = emp.totalRecords > 0 ? (emp.sumPctImp / emp.totalRecords) : 0;
                        sumPct += pctEmp;
                        sumImporteAcumFarmacia += emp.sumImporteAcum;
                    });
                    const countEmp = empleadosMap.size || 1;

                    // OVERRIDE: si pcpFarmMap tiene dato de esta farmacia, usar % Imp. PcP (o calcularlo) y el importe acumulado
                    const pcpFarmData = pcpFarmMap.get(farmaciaNombre) || pcpFarmMap.get(farmaciaClean);
                    const pcpFarmImporte = pcpFarmData ? pcpFarmData.impAcum : 0;
                    const pcpFarmPct = pcpFarmData ? pcpFarmData.pctPcp : null;
                    let promPct;

                    if (pcpFarmPct !== null && pcpFarmPct > 0) {
                        // Usar porcentaje directo desde el CSV (columna [D])
                        promPct = pcpFarmPct;
                        sumImporteAcumFarmacia = pcpFarmImporte;
                    } else if (pcpFarmImporte > 0 && metaImportePcp > 0) {
                        // % = importe acumulado / meta importe * 100
                        promPct = (pcpFarmImporte / metaImportePcp) * 100;
                        sumImporteAcumFarmacia = pcpFarmImporte;
                    } else if (pcpFarmImporte > 0) {
                        // Sin meta de importe disponible, usar promedio de empleados como base
                        promPct = sumPct / countEmp;
                        sumImporteAcumFarmacia = pcpFarmImporte;
                    } else {
                        promPct = sumPct / countEmp;
                    }

                    // CANDADOS DE FARMACIA
                    const c1_farmacia = (metaBateo === 0 || sdrInfo.bat >= metaBateo) && (metaPP === 0 || sdrInfo.pp >= metaPP);
                    const c2_farmacia = metaPcpBase === 0 || promPct >= metaPcpBase;
                    const c3_farmacia = (metaCepip === 0 || farmaciaCepip >= metaCepip);
                    const c4_farmacia = (!esquema.usarMetaPCPDollar || metaImportePcp === 0 || sumImporteAcumFarmacia >= metaImportePcp);
                    const candadoDesbloqueadoFarmacia = c1_farmacia && c2_farmacia && c3_farmacia && c4_farmacia;

                    // BONOS DE FARMACIA (APLICAN SOLO SI ESTA CONFIGURADO PARA FARMACIA)
                    let bonosFarmaciaGanados = 0;
                    let importeBonosFarmacia = 0;
                    bonosConfig.forEach(bono => {
                        const minBono = parseFloat(bono.min) || 0;
                        const montoBono = parseFloat(bono.monto) || 0;
                        const aplicaA = bono.aplicaA || 'FARMACIA';
                        if (aplicaA === 'FARMACIA' && promPct >= minBono && minBono > 0) {
                            bonosFarmaciaGanados += 1;
                            importeBonosFarmacia += montoBono;
                        }
                    });

                    let cumplimientoFarmacia = '';
                    if (bonosFarmaciaGanados > 0) cumplimientoFarmacia = `Ganó ${bonosFarmaciaGanados} bono${bonosFarmaciaGanados > 1 ? 's' : ''}`;
                    else if (promPct < metaPcpBase) cumplimientoFarmacia = 'No alcanzó';
                    else cumplimientoFarmacia = 'Meta base';

                    // CONDICIÓN: FARMACIA % IMP. PCP >= 38%
                    const farmaciaAlcanzoMeta = promPct >= (metaPcpBase > 0 ? metaPcpBase : 38);

                    // 2. CÁLCULO POR EMPLEADO
                    const empleadosList = [];
                    empleadosMap.forEach(emp => {
                        const pctPromedioEmpleado = emp.totalRecords > 0 ? (emp.sumPctImp / emp.totalRecords) : 0;
                        const importeTotalAcumulado = emp.sumImporteAcum;
                        // BONOS Y CUMPLIMIENTO DEL EMPLEADO BASADOS EN % PCP DE LA FARMACIA (promPct) O INDIVIDUAL (pctPromedioEmpleado) SEGÚN aplicaA

                                                ),
                                                e('div', { className: "grid grid-cols-1 lg:grid-cols-6 gap-2 w-full lg:h-[500px]" },
                                                    e(RankingTable, { title: "PCP $", dataKey: "totalImporteAcum", metaVal: 0, isMoneda: true, iconKey: 'superoMetaImporte' }),
                                                    e(RankingTable, { title: "PCP %", dataKey: "promedioPct", metaVal: parsePercent(esquema.metaPCP || 0), isPct: true, iconKey: 'pcpOk' }),
                                                    e(RankingTable, { title: "BATEO", dataKey: "bateo", metaVal: parsePercent(esquema.bateo || 0), isPct: true, iconKey: 'bateoOk' }),
                                                    e(RankingTable, { title: "PP", dataKey: "pp", metaVal: parseNum(esquema.precioPromedio || 0), isMoneda: true, iconKey: 'ppOk' }),
                                                    e(RankingTable, { title: "CEPIP", dataKey: "cepip", metaVal: parsePercent(esquema.cepipMin || 0), isPct: true, iconKey: 'cepipOk', multiplier: 100, compareToMeta: true }),
                                                    e(RankingTable, { title: "3X2 %", dataKey: "3x2", metaVal: 100, isPct: true, iconKey: '3x2' })
                                                )
                                            );
                                        })()
                                    )
                                ),
                                // RESUMEN EJECUTIVO
                                e('div', { className: "glass-card p-5 rounded-xl flex flex-col col-span-2" },
                                    e('h3', { className: "text-[11px] font-black sky-text mb-4 uppercase border-b pb-2" }, "Resumen de Inversión y Premiación Global"),
                                    e('div', { className: "grid grid-cols-1 sm:grid-cols-3 gap-6 mt-2" },
                                        e('div', { className: "bg-blue-50/50 p-4 rounded-lg flex flex-col items-center justify-center text-center border border-blue-100" },
                                            e('span', { className: "text-[9px] font-bold text-blue-800 uppercase mb-1" }, "Inversión Base (Metas)"),
                                            e('span', { className: "text-xl font-black text-blue-900 font-mono" }, `$${totalMetasGeneradas.toLocaleString('es-MX', { minimumFractionDigits: 2 })}`)
                                        ),
                                        e('div', { className: "bg-purple-50/50 p-4 rounded-lg flex flex-col items-center justify-center text-center border border-purple-100" },
                                            e('span', { className: "text-[9px] font-bold text-purple-800 uppercase mb-1" }, "Inversión en Bonos"),
                                            e('span', { className: "text-xl font-black text-purple-900 font-mono" }, `$${totalBonosGenerados.toLocaleString('es-MX', { minimumFractionDigits: 2 })}`)
                                        ),
                                        e('div', { className: "bg-green-50/50 p-4 rounded-lg flex flex-col items-center justify-center text-center border border-green-100 shadow-sm" },
                                            e('span', { className: "text-[9px] font-bold text-green-800 uppercase mb-1" }, "Total Liberado a Pagar"),
                                            e('span', { className: "text-2xl font-black text-green-700 font-mono" }, `$${totalPagar.toLocaleString('es-MX', { minimumFractionDigits: 2 })}`)
                                        )
                                    ),
                                    e('div', { className: "mt-4 text-[9px] text-gray-500 text-center flex justify-center items-center gap-2" },
                                        e('span', { className: "bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded font-bold" }, `Retenido por Candados: $${totalRetenidoCandados.toLocaleString('es-MX', { minimumFractionDigits: 2 })}`),
                                        "Monto generado por desempeño pero bloqueado por incumplimiento de filtros Bateo/PP/CEPIP."
                                    )
                                )
                            );
                        })()
                    ] : null,

                    // MODAL COMPACTO DE SELECCION DE PRODUCTOS 3X2 (QLIKVIEW)
                    showModal3x2 && e('div', { className: "fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-xs p-3" },
                        e('div', { className: "bg-white rounded-xl shadow-2xl max-w-lg w-full max-h-[90vh] flex flex-col overflow-hidden animate-pop border border-blue-100 text-xs" },
                            // Cabecera compacta
                            e('div', { className: "px-4 py-2.5 bg-blue-50 border-b flex justify-between items-center" },
                                e('div', { className: "flex items-center gap-2" },
                                    e('span', { className: "text-xs font-bold text-blue-900 uppercase" }, "Productos 3x2"),
                                    e('span', { className: "bg-blue-200 text-blue-800 text-[9px] font-bold px-1.5 py-0.5 rounded-full" }, `${productos3x2Seleccionados.size} seleccionados`)
                                ),
                                e('button', {
                                    className: "text-gray-400 hover:text-gray-700 text-sm font-bold px-1.5 py-0.5 rounded hover:bg-gray-200",
                                    onClick: () => setShowModal3x2(false)
                                }, "✕")
                            ),
                            // Buscador de productos
                            e('div', { className: "p-2.5 bg-gray-50 border-b space-y-1.5" },
                                e('input', {
                                    type: 'text',
                                    placeholder: '🔍 Buscar producto (muestra hasta 10 resultados)...',
                                    className: "w-full border rounded px-2.5 py-1 text-xs outline-none focus:ring-1 focus:ring-blue-400 bg-white",
                                    value: filtroModal3x2,
                                    onChange: (ev) => setFiltroModal3x2(ev.target.value)
                                }),
                                // Lista de max 10 productos encontrados
                                e('div', { className: "space-y-1 max-h-36 overflow-y-auto" },
                                    (() => {
                                        const filtrados = productos3x2
                                            .filter(p => !filtroModal3x2 || p.toLowerCase().includes(filtroModal3x2.toLowerCase()))
                                            .slice(0, 10);
                                        if (filtrados.length === 0) {
                                            return e('div', { className: "text-center py-2 text-[10px] text-gray-400" }, "No se encontraron productos coincidentes");
                                        }
                                        return filtrados.map(prod => {
                                            const isChecked = productos3x2Seleccionados.has(prod);
                                            return e('label', {
                                                key: `search-${prod}`,
                                                className: `flex items-center justify-between px-2 py-1 rounded text-[10px] cursor-pointer transition-colors border ${isChecked ? 'bg-blue-50 border-blue-200 text-blue-900 font-semibold' : 'bg-white border-gray-200 text-gray-700 hover:bg-gray-150'
                                                    }`
                                            },
                                                e('div', { className: "flex items-center gap-1.5 truncate flex-1" },
                                                    e('input', {
                                                        type: 'checkbox',
                                                        checked: isChecked,
                                                        className: "rounded text-blue-600 focus:ring-blue-400 w-3 h-3",
                                                        onChange: () => {
                                                            const next = new Set(productos3x2Seleccionados);
                                                            if (isChecked) next.delete(prod);
                                                            else next.add(prod);
                                                            setProductos3x2Seleccionados(next);
                                                        }
                                                    }),
                                                    e('span', { className: "truncate" }, prod)
                                                ),
                                                e('span', { className: "text-[8px] text-gray-400 ml-1 shrink-0 font-mono" }, isChecked ? 'Agregado' : '+ Agregar')
                                            );
                                        });
                                    })()
                                )
                            ),
                            // Tabla simple y compacta de productos seleccionados
                            e('div', { className: "p-2.5 flex-1 flex flex-col min-h-0 space-y-1" },
                                e('div', { className: "flex justify-between items-center text-[10px] font-bold text-gray-600 px-1" },
                                    e('span', null, `TABLA DE SELECCIONADOS (${productos3x2Seleccionados.size})`),
                                    productos3x2Seleccionados.size > 0 && e('button', {
                                        type: 'button',
                                        className: "text-[9px] text-red-500 hover:text-red-700 underline",
                                        onClick: () => setProductos3x2Seleccionados(new Set())
                                    }, "Limpiar tabla")
                                ),
                                e('div', { className: "border rounded overflow-y-auto max-h-40 bg-white" },
                                    e('table', { className: "w-full text-left border-collapse text-[9px]" },
                                        e('thead', { className: "bg-gray-100 border-b text-gray-600 sticky top-0" },
                                            e('tr', null,
                                                e('th', { className: "py-1 px-2 w-6 text-center" }, "#"),
                                                e('th', { className: "py-1 px-2 text-left" }, "Producto"),
                                                e('th', { className: "py-1 px-2 w-8 text-center" }, "Quitar")
                                            )
                                        ),
                                        e('tbody', null,
                                            productos3x2Seleccionados.size === 0 ?
                                                e('tr', null, e('td', { colSpan: 3, className: "text-center py-4 text-gray-400 italic" }, "Sin productos seleccionados")) :
                                                Array.from(productos3x2Seleccionados).map((prod, idx) =>
                                                    e('tr', { key: `sel-${prod}`, className: "border-b hover:bg-gray-50 transition-colors" },
                                                        e('td', { className: "py-0.5 px-2 text-center text-gray-400 font-mono" }, idx + 1),
                                                        e('td', { className: "py-0.5 px-2 text-gray-800 font-medium truncate max-w-[320px]" }, prod),
                                                        e('td', { className: "py-0.5 px-2 text-center" },
                                                            e('button', {
                                                                type: 'button',
                                                                className: "text-red-500 hover:text-red-700 font-bold px-1",
                                                                title: "Quitar",
                                                                onClick: () => {
                                                                    const next = new Set(productos3x2Seleccionados);
                                                                    next.delete(prod);
                                                                    setProductos3x2Seleccionados(next);
                                                                }
                                                            }, "✕")
                                                        )
                                                    )
                                                )
                                        )
                                    )
                                )
                            ),
                            // Pie con botón Aceptar
                            e('div', { className: "px-4 py-2 bg-gray-50 border-t flex justify-end gap-2" },
                                e('button', {
                                    className: "px-3 py-1 rounded text-[11px] text-gray-600 hover:bg-gray-200 font-semibold",
                                    onClick: () => setShowModal3x2(false)
                                }, "Cancelar"),
                                e('button', {
                                    className: "sky-bg-primary text-white text-[11px] font-bold px-4 py-1 rounded shadow transition-all active:scale-95",
                                    onClick: () => {
                                        setShowModal3x2(false);
                                        setNotificacion(`Selección guardada: ${productos3x2Seleccionados.size} productos para 3x2`);
                                        setTimeout(() => setNotificacion(null), 3000);
                                    }
                                }, "Aceptar")
                            )
                        )
                    )
                )
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(e(App));
    </script>
</body>

</html>
